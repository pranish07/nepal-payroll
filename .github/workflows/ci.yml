name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm run build
      - name: Serve smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          DB_PATH=:memory: PORT=3100 npm start &
          SERVER_PID=$!
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3100/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:3100/api/health
          curl -fsS http://localhost:3100/ | head -c 200
          kill "$SERVER_PID"
